[project]
name = "stridelab"
version = "0.1.0"
description = "Explore running data from .fit files with a pure-Python FIT decoder"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
]

[dependency-groups]
dev = [
    "marimo>=0.25.1",
    "polars>=2.0.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["*.md"]  # docs keep their hand-aligned code comments
